        overflow-x: clip;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(
            640px circle at 85% -10%,
            color-mix(in srgb, var(--ac) 20%, transparent),
            transparent 60%
          ),
          radial-gradient(520px circle at 0% 100%, #38bdf825, transparent 60%);
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px clamp(14px, 4vw, 24px) 56px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .mu {
        color: var(--mu);
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 38px);
        line-height: 1.1;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, var(--ac), var(--g2));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      .btn {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          120deg,
          var(--ac),
          color-mix(in srgb, var(--ac) 55%, var(--g2))
        );
        color: #06230f;
        border: 0;
        border-radius: 12px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        white-space: nowrap;
        transition:
          transform 0.2s,
          box-shadow 0.25s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 26px color-mix(in srgb, var(--ac) 45%, transparent);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.alt {
        background: var(--sf);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: clamp(16px, 3vw, 24px);
        margin: 14px 0;
        backdrop-filter: blur(6px);
        animation: in 0.5s both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--mu);
        margin: 12px 0 4px;
      }
      input,
      textarea {
        width: 100%;
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
        font: inherit;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      textarea {
        min-height: 130px;
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        outline: 0;
        border-color: var(--ac);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 22%, transparent);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row > input {
        flex: 1 1 160px;
        width: auto;
        min-width: 0;
      }
      .at {
        display: flex;
        align-items: stretch;
      }
      .at input {
        border-radius: 12px 0 0 12px;
        border-right: 0;
        min-width: 0;
      }
      .at span {
        display: grid;
        place-items: center;
        padding: 0 14px;
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 0 12px 12px 0;
        font-weight: 700;
        color: var(--ac);
        white-space: nowrap;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .chip {
        background: var(--bg);
        border: 1px solid var(--bd);
        color: var(--tx);
        border-radius: 999px;
        padding: 7px 14px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .chip:hover {
        border-color: var(--ac);
        transform: translateY(-2px);
      }
      .chip.on {
        background: var(--ac);
        color: #06230f;
        border-color: var(--ac);
        font-weight: 700;
      }
      .msg {
        min-height: 22px;
        margin-top: 8px;
        font-size: 14px;
      }
      .msg.ok {
        color: var(--ac);
      }
      .msg.bad {
        color: var(--rd);
      }
      .addr {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 16px;
        border-radius: 14px;
        border: 1px dashed var(--ac);
        background: color-mix(in srgb, var(--ac) 8%, var(--bg));
      }
      .addr b {
        font-size: clamp(18px, 4.6vw, 26px);
        overflow-wrap: anywhere;
        flex: 1 1 220px;
      }
      .note {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--bg);
        font-size: 14px;
        color: var(--mu);
        margin-top: 12px;
      }
      .note b {
        color: var(--tx);
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--bd);
        margin: 16px 0 12px;
        overflow-x: auto;
      }
      .tabs button {
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        color: var(--mu);
        font: inherit;
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tabs button.on {
        color: var(--ac);
        border-color: var(--ac);
      }
      .mail {
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--bg);
        margin: 8px 0;
        overflow: hidden;
        animation: in 0.35s both;
      }
      .mail > button {
        all: unset;
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        cursor: pointer;
      }
      .mail > button:hover {
        background: color-mix(in srgb, var(--ac) 8%, transparent);
      }
      .mail .t {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .mail .t b {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mail small {
        color: var(--mu);
        white-space: nowrap;
      }
      .mail .s {
        color: var(--mu);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }
      .mail .body {
        display: none;
        padding: 0 14px 14px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .mail.open .body {
        display: block;
      }
      .empty {
        padding: 30px 10px;
        text-align: center;
        color: var(--mu);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--tx);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 22px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: calc(100vw - 24px);
        text-align: center;
        z-index: 9;
      }
      .toast.on {
        opacity: 1;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 520px) {
        .btn {
          padding: 11px 14px;
        }
        .row .btn {
          flex: 1 1 100%;
        }
        .at span {
          padding: 0 9px;
          font-size: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

        <h1>Claim your email</h1>
      </div>
      <p class="mu" style="margin: 6px 0 0">
        Enter your call number and pick a short address at <b>@vlzo.com</b>.

      </p>

      <section class="card" id="claimCard">
        <h2>1. Your number</h2>
        <label for="num">EcoMeet call number</label>
        <div class="row">
          <input
            id="num"
            inputmode="numeric"
            maxlength="14"
            placeholder="e.g. 650 428 931"
            autocomplete="off"
          /><button class="btn" id="chk" type="button">Check</button>
        </div>
        <div class="msg" id="numMsg"></div>
        <div id="pick" hidden>
          <h2 style="margin-top: 18px">2. Pick a short address</h2>
          <div class="chips" id="chips"></div>
          <label for="hnd"
            >Or type your own (3 to 16 letters, numbers, dot, dash)</label
          >
          <div class="at">
            <input
              id="hnd"
              maxlength="16"
              placeholder="yourname"
              autocomplete="off"
              spellcheck="false"
              autocapitalize="off"
            /><span>@vlzo.com</span>
          </div>
          <div class="msg" id="hMsg"></div>
          <button
            class="btn"
            id="claim"
            type="button"
            style="margin-top: 6px"
            disabled
          >

          </button>
        </div>
      </section>

        </div>
        <div id="tCompose" hidden>
          <label for="to">To</label
          ><input
            id="to"
            type="email"
            placeholder="someone@example.com"
            autocomplete="off"
          />
          <label for="sub">Subject</label
          ><input id="sub" maxlength="150" placeholder="Subject" />
          <label for="txt">Message</label
          ><textarea
            id="txt"
            maxlength="5000"
            placeholder="Write your message"
          ></textarea>
          <div class="row" style="margin-top: 12px">
            <button class="btn" id="send" type="button">Send</button
            ><span class="mu" id="sMsg"></span>
          </div>
        </div>
        <div id="tSent" hidden><div id="sentList"></div></div>
      </section>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      /* ============ SETTINGS ============
   MAIL_API: the address of your mail backend (see vlzo-mail-worker.js and SETUP in the notes).
   Leave it empty and the page still works, but only as a preview on this device:
   addresses are reserved locally and nothing is really sent or received. */
      const MAIL_API = "";
      const DOMAIN = "vlzo.com";
      /* ================================== */
      const $ = (id) => document.getElementById(id);
      const rd = (k, d) => {
        try {
          const v = JSON.parse(localStorage.getItem(k));
          return v == null ? d : v;
        } catch (e) {
          return d;
        }
      };
      const wr = (k, v) => {
        try {
          localStorage.setItem(k, JSON.stringify(v));
          return true;
        } catch (e) {
          return false;
        }
      };
      const esc = (s) => String(s == null ? "" : s);
      function toast(t) {
        const d = $("toast");
        d.textContent = t;
        d.classList.add("on");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => d.classList.remove("on"), 2400);
      }
      /* same check-digit rule EcoMeet uses for call numbers */
      function sum(s, dbl) {
        let t = 0;
        for (let i = s.length - 1; i >= 0; i--) {
          let n = +s[i];
          if (dbl) {
            n *= 2;
            if (n > 9) n -= 9;
          }
          t += n;
          dbl = !dbl;
        }
        return t;
      }
      const validNum = (s) => /^\d{9}$/.test(s) && sum(s, false) % 10 === 0;
      const digits = (v) => String(v || "").replace(/\D/g, "");
      const fmt = (c) => String(c).replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3");
      const meMember = () => {
        const m = rd("em_member", null);
        return m && validNum(String(m.call)) ? m : null;
      };
      const RESERVED = new Set(
        "admin administrator support postmaster abuse root info hello noreply no-reply contact mail webmaster security help sales billing ecomeet vlzo team staff".split(
          " ",
        ),
      );
      const HANDLE = /^[a-z0-9](?:[a-z0-9._-]{1,14})[a-z0-9]$/;
      function badHandle(h) {
        if (!h) return "";
        if (h.length < 3) return "At least 3 characters.";
        if (h.length > 16) return "Keep it short: 16 characters at most.";
        if (!HANDLE.test(h))
          return "Use letters and numbers; dot, dash or underscore only in the middle.";
        if (/[._-]{2}/.test(h)) return "No two symbols in a row.";
        if (RESERVED.has(h)) return "That name is reserved.";
        return "";
      }
      const claims = () =>
        rd("em_mail_claims", {}); /* handle -> call (this device) */
      const mine = () => rd("em_mail_me", null); /* {handle, call, token} */
      let call = null,
        handle = "";

      /* ---------- step 1: number ---------- */
      function checkNumber() {
        const c = digits($("num").value),
          msg = $("numMsg");
        msg.className = "msg";
        if (!c) {
          msg.textContent = "";
          return;
        }
        if (c.length !== 9 || !validNum(c)) {
          msg.textContent = "That is not a valid 9 digit EcoMeet number.";
          msg.classList.add("bad");
          $("pick").hidden = true;
          return;
        }
        const m = meMember();
        if (!m || m.call !== c) {
          msg.textContent =
            "This number is not signed in on this device. Log in to EcoMeet with this number first.";
          msg.classList.add("bad");
          $("pick").hidden = true;
          return;
        }
        call = c;
        msg.textContent = "Number verified for " + m.name + ".";
        msg.classList.add("ok");
        $("pick").hidden = false;
        suggest(m.name);
        $("hnd").focus();
      }
      $("chk").onclick = checkNumber;
      $("num").onkeydown = (e) => {
        if (e.key === "Enter") checkNumber();
      };

      /* ---------- step 2: short address ---------- */
      function suggest(name) {
        const base =
            String(name || "")
              .toLowerCase()
              .replace(/[^a-z0-9]/g, "")
              .slice(0, 8) || "user",
          t = call.slice(-3),
          f = call.slice(-4);
        const parts = String(name || "")
          .toLowerCase()
          .split(/\s+/)
          .map((w) => w.replace(/[^a-z0-9]/g, ""))
          .filter(Boolean);
        const opts = [
          base + t,
          base,
          parts.length > 1 ? parts[0].slice(0, 6) + "." + parts[1][0] : "",
          base.slice(0, 6) + f,
          "eco" + t,
        ].filter(Boolean);
        const list = [...new Set(opts)]
          .filter((h) => !badHandle(h) && !claims()[h])
          .slice(0, 5);
        $("chips").innerHTML = "";
        list.forEach((h) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = h + "@" + DOMAIN;
          b.onclick = () => {
            $("hnd").value = h;
            validate();
          };
          $("chips").appendChild(b);
        });
      }
      let vt;
      function validate() {
        handle = $("hnd").value.trim().toLowerCase();
        $("hnd").value = handle;
        document
          .querySelectorAll(".chip")
          .forEach((c) =>
            c.classList.toggle("on", c.textContent === handle + "@" + DOMAIN),
          );
        const e = badHandle(handle),
          m = $("hMsg");
        m.className = "msg";
        $("claim").disabled = true;
        if (!handle) {
          m.textContent = "";
          return;
        }
        if (e) {
          m.textContent = e;
          m.classList.add("bad");
          return;
        }
        if (claims()[handle]) {
          m.textContent = "Already taken on this device. Try another.";
          m.classList.add("bad");
          return;
        }
        m.textContent = handle + "@" + DOMAIN + " looks good.";
        m.classList.add("ok");
        $("claim").disabled = false;
      }
      $("hnd").oninput = () => {
        clearTimeout(vt);
        vt = setTimeout(validate, 120);
      };

      async function api(path, opt) {
        const r = await fetch(MAIL_API.replace(/\/$/, "") + path, opt);
        let j = null;
        try {
          j = await r.json();
        } catch (e) {}
        return { ok: r.ok, status: r.status, j };
      }

      $("claim").onclick = async () => {
        if (!call || !handle || badHandle(handle)) return;
        $("claim").disabled = true;
        $("claim").textContent = "Claiming…";
        try {
          let token = "local";
          if (MAIL_API) {
            const r = await api("/claim", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ handle, call }),
            });
            if (r.status === 409) {
              $("hMsg").textContent =
                "Someone already has that address. Try another.";
              $("hMsg").className = "msg bad";
              return;
            }
            if (!r.ok || !r.j || !r.j.token) {
              $("hMsg").textContent =
                "Could not reach the mail server. Try again.";
              $("hMsg").className = "msg bad";
              return;
            }
            token = r.j.token;
          }
          const c = claims();
          c[handle] = call;
          wr("em_mail_claims", c);
          wr("em_mail_me", { handle, call, token });
          toast("Your email is yours: " + handle + "@" + DOMAIN);
          show();
        } finally {
          $("claim").textContent = "Claim this email";
          validate();
        }
      };

      /* ---------- your mailbox ---------- */
      function show() {
        const me = mine();
        $("claimCard").hidden = !!me;
        $("mailCard").hidden = !me;
        if (!me) return;
        $("myAddr").textContent = me.handle + "@" + DOMAIN;
        $("modeNote").innerHTML = MAIL_API
          ? "<b>Live.</b> Mail sent to this address arrives in your inbox here."
          : "<b>Preview mode.</b> This address is reserved on this device only. To really send and receive, connect your mail server (set <b>MAIL_API</b> at the top of this page).";
        loadInbox();
        renderSent();
      }
      $("cpy").onclick = async () => {
        const t = $("myAddr").textContent;
        try {
          await navigator.clipboard.writeText(t);
        } catch (e) {
          const a = document.createElement("textarea");
          a.value = t;
          document.body.appendChild(a);
          a.select();
          try {
            document.execCommand("copy");
          } catch (_) {}
          a.remove();
        }
        toast("Email copied");
      };
      document.querySelectorAll(".tabs button").forEach(
        (b) =>
          (b.onclick = () => {
            document
              .querySelectorAll(".tabs button")
              .forEach((x) => x.classList.toggle("on", x === b));
            ["inbox", "compose", "sent"].forEach(
              (t) =>
                ($("t" + t[0].toUpperCase() + t.slice(1)).hidden =
                  t !== b.dataset.t),
            );
          }),
      );
      function fmtDate(v) {
        try {
          return new Date(v).toLocaleString([], {
            dateStyle: "medium",
            timeStyle: "short",
          });
        } catch (e) {
          return "";
        }
      }
      function card(m, sentView) {
        const d = document.createElement("div");
        d.className = "mail";
        const b = document.createElement("button");
        b.type = "button";
        const t = document.createElement("div");
        t.className = "t";
        const n = document.createElement("b");
        n.textContent = sentView ? "To: " + m.to : m.from;
        const dt = document.createElement("small");
        dt.textContent = fmtDate(m.date);
        t.append(n, dt);
        const s = document.createElement("div");
        s.className = "s";
        s.textContent = m.subject || "(no subject)";
        b.append(t, s);
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = m.text || "";
        d.append(b, body);
        b.onclick = () => d.classList.toggle("open");
        return d;
      }
      async function loadInbox() {
        const me = mine();
        if (!me) return;
        const L = $("inList");
        if (!MAIL_API) {
          L.innerHTML =
            '<div class="empty">Your inbox is empty.<br>Connect the mail server to receive real email.</div>';
          $("inCount").textContent = "";
          return;
        }
        L.innerHTML = '<div class="empty">Loading…</div>';
        try {
          const r = await api(
            "/inbox?handle=" + encodeURIComponent(me.handle),
            { headers: { authorization: "Bearer " + me.token } },
          );
          if (!r.ok) throw 0;
          const list = Array.isArray(r.j) ? r.j : [];
          L.innerHTML = "";
          $("inCount").textContent = list.length
            ? list.length + (list.length === 1 ? " message" : " messages")
            : "";
          if (!list.length)
            L.innerHTML =
              '<div class="empty">No mail yet. Share your address and it lands here.</div>';
          list.forEach((m) => L.appendChild(card(m, false)));
        } catch (e) {
          L.innerHTML =
            '<div class="empty">Could not load your inbox. Check the connection and press Refresh.</div>';
        }
      }
      $("refresh").onclick = loadInbox;
      function renderSent() {
        const me = mine(),
          L = $("sentList"),
          all = rd("em_mail_sent_" + (me && me.handle), []);
        L.innerHTML = "";
        if (!all.length)
          L.innerHTML = '<div class="empty">Nothing sent yet.</div>';
        else
          all
            .slice()
            .reverse()
            .forEach((m) => L.appendChild(card(m, true)));
      }
      $("send").onclick = async () => {
        const me = mine();
        if (!me) return;
        const to = $("to").value.trim(),
          sub = $("sub").value.trim(),
          text = $("txt").value.trim(),
          sm = $("sMsg");
        if (!/^\S+@\S+\.\S+$/.test(to)) {
          sm.textContent = "Enter a valid recipient email.";
          return;
        }
        if (!text) {
          sm.textContent = "Write a message first.";
          return;
        }
        if (!MAIL_API) {
          sm.textContent =
            "Preview mode: nothing can be sent until the mail server is connected.";
          return;
        }
        $("send").disabled = true;
        sm.textContent = "Sending…";
        try {
          const r = await api("/send", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              authorization: "Bearer " + me.token,
            },
            body: JSON.stringify({ handle: me.handle, to, subject: sub, text }),
          });
          if (!r.ok) throw 0;
          const k = "em_mail_sent_" + me.handle,
            a = rd(k, []);
          a.push({ to, subject: sub, text, date: Date.now() });
          wr(k, a.slice(-100));
          $("to").value = $("sub").value = $("txt").value = "";
          sm.textContent = "";
          toast("Sent from " + me.handle + "@" + DOMAIN);
          renderSent();
        } catch (e) {
          sm.textContent = "Could not send. Try again.";
        } finally {
          $("send").disabled = false;
        }
      };
      /* start */
      $("stat").textContent = MAIL_API ? "Live" : "Preview";
      (function () {
        const m = meMember();
        if (m && !mine()) {
          $("num").value = fmt(m.call);
          checkNumber();
        }
        show();
      })();
    </script>
  </body>
</html>
