<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Services | The Third World Peace VLZO UFO</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b1a;--surface:#0c1630;--raised:#111f42;--line:#1e2e57;--text:#e8eefc;--muted:#a3b3d6;--accent:#4fd1ff;--ink:#04101f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 500px at 80% -10%,#0e2a5c55,transparent),var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;line-height:1.2}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
header{position:sticky;top:0;z-index:10;background:#050b1acc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;font:600 15px Sora,sans-serif;color:var(--text);text-decoration:none;flex:1}.brand img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 0 8px #4fd1ff66)}.brand span.wm{display:block}.wm-t{display:block;font:700 22px/1.1 Sora,sans-serif;letter-spacing:-.01em}.brand small{display:block;font:400 12px Inter;color:var(--muted)}
.btn{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;text-decoration:none;display:inline-block;transition:background .15s}
.btn:hover{background:var(--raised)}.btn.primary{background:var(--accent);color:var(--ink);border-color:transparent}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
.hero{padding:60px 0 24px}.hero h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:18px;max-width:58ch;margin:14px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:28px 0 8px}
.search{flex:1;min-width:220px}.search input{width:100%;padding:12px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px}
.chip.on{background:var(--accent);color:var(--ink);border-color:transparent;font-weight:600}
.count{color:var(--muted);font-size:14px;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:70px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--text);transition:transform .18s,border-color .18s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--raised)}
.card h3{font-size:18px}.card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.tag{font-size:12.5px;color:var(--accent);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
dialog{max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:0}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
.d{padding:28px}.d .top{display:flex;gap:16px;align-items:center;margin-bottom:14px}.d h2{font-size:26px}
.x{margin-left:auto;background:var(--raised);border:0;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px}
.d h3{font-size:14px;color:var(--muted);margin:20px 0 8px;font-weight:600}
.d ul{margin:0;padding-left:20px;color:var(--text)}.d li{margin:4px 0}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta div{background:var(--raised);padding:12px 14px;border-radius:12px;font-size:14.5px}.meta b{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.d .btn{margin-top:24px}
footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:600px){.meta{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="EcoOrbit.html"><img src="/images/EcoOrbit_Logo.png" alt="EcoOrbit logo" width="46" height="46"><span class="wm"><b class="wm-t"><span class="eo-eco">Eco</span><span class="eo-orbit">Orbit</span></b><small>The Third World Peace VLZO UFO &middot; Our Services</small></span></a>
  <a class="btn primary" href="EcoOrbit.html">Back to app</a>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>Everything we offer, in one place</h1>
    <p>Tools for tracking Low Earth Orbit, measuring sustainability and staying safe. Pick any service to see what it does and open it.</p>
    <div class="tools">
      <div class="search"><input id="q" type="search" placeholder="Search services" aria-label="Search services"></div>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>
  <section class="grid" id="grid"></section>
</main>

<dialog id="dlg" aria-labelledby="dt"><div class="d" id="dbody"></div></dialog>
<footer>Built for the NASA Space Apps Challenge &middot; Not affiliated with NASA</footer>

<script>
/* Edit this list to add, remove or change services. */
const SERVICES=[
{id:'simulator',icon:'🛰️',name:'3D VLZO UFO Simulator',cat:'Tracking',short:'Explore satellites and debris on an interactive 3D globe.',
 who:'Students, researchers, space fans',status:'Available',url:'EcoOrbit.html#simulator',
 about:'An interactive Low Earth Orbit globe. Click any orbiting satellite or debris piece to inspect its carbon cost, orbital speed and risk level.',
 feats:['Rotate and zoom the globe','Inspect each object\'s details','Compare satellites with debris']},
{id:'globe',icon:'🌍',name:'3D Globe & Data',cat:'Tracking',short:'The full globe page with live tracking data.',
 who:'Anyone exploring orbital data',status:'Available',url:'project/web/index.html',
 about:'The main globe experience from the project, with tracking, alerts and asset views in one place.',
 feats:['Full-screen globe','Tracking and alerts pages','Built from public orbital data']},
{id:'score',icon:'🌱',name:'Orbit Sustainability Score',cat:'Sustainability',short:'Get a score for how sustainable a mission is.',
 who:'Space agencies and satellite operators',status:'Available',url:'EcoOrbit.html#calculator',
 about:'A calculator that rates an operator\'s orbital footprint, from launch impact to end-of-life plans, and gives a single easy-to-read score.',
 feats:['Adjustable mission inputs','Instant score','Ideas to improve the result']},
{id:'credits',icon:'♻️',name:'Carbon Credit Offsets',cat:'Sustainability',short:'Reward cleaner space operations with green credits.',
 who:'Operators and sustainability teams',status:'Prototype',url:'EcoOrbit.html#calculator',
 about:'A concept for crediting missions that keep orbit cleaner, so responsible operators are recognised and rewarded.',
 feats:['Credits tied to your score','Clear, simple reporting','Designed for transparency']},
{id:'collision',icon:'⚠️',name:'Collision Risk Alerts',cat:'Safety',short:'Spot collision risks and see ways to avoid them.',
 who:'Mission planners and learners',status:'Prototype',url:'EcoOrbit.html#collision',
 about:'Estimates the chance of a satellite meeting debris and suggests avoidance paths. These are educational estimates, not real flight advice.',
 feats:['Risk levels at a glance','Suggested avoidance paths','Plain-language explanations']},
{id:'vashan',icon:'🛡️',name:'VASHAN Antivirus',cat:'Security',short:'Scan a file for known threat indicators.',
 who:'Everyday users',status:'Available',url:'VASHAN_Antivirus.html',
 about:'A browser-based scanner that checks files against a list of known threat names and explains any match. It is a demo and does not replace a full antivirus.',
 feats:['Scan files in your browser','Threat information pages','Files never leave your device']},
{id:'privacy',icon:'🔒',name:'Privacy & Safety',cat:'Security',short:'See what we store and control your data.',
 who:'Every visitor',status:'Available',url:'Privacy_and_Safety.html',
 about:'A plain-language guide to how your information is handled, with switches to manage or delete anything saved on your device.',
 feats:['Download or delete your data','Safety checklist','Searchable and easy to read']},
{id:'test',icon:'🧠',name:'Test Yourself',cat:'Security',short:'A 20-question cyber security test with a certificate.',
 who:'Anyone who wants to stay safe online',status:'Available',url:'Test_Yourself.html',
 about:'Answer 20 cyber security questions. Get them all right to earn an official certificate and digital badge. If you miss any, see exactly which ones.',
 feats:['20 questions on staying safe online','Instant results and answer review','Certificate and badge for a perfect score']},
{id:'member',icon:'👑',name:'Membership',cat:'Media',short:'Pick a plan and unlock more of the platform.',
 who:'Students, researchers and organisations',status:'Available',url:'Membership.html',
 about:'Choose from plans for every level, from a free Explorer plan to Mission Control for organisations. Switch between monthly and yearly billing to see the price change.',
 feats:['Free and paid plans','Yearly billing saves two months','Secure payment through our provider']},
{id:'tv',icon:'📺',name:'VLZO TV',cat:'Media',short:'Watch our hackathon presentation and more.',
 who:'Judges, teammates and fans',status:'Available',url:'VLZO_TV.html',
 about:'Our own video site. Watch the hackathon presentation, like and comment, and see what is coming next.',
 feats:['Video player with likes and comments','Up-next list','New videos coming soon']}
];
const $=s=>document.querySelector(s);let cat='All',q='';
const cats=['All',...new Set(SERVICES.map(s=>s.cat))];
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chips(){$('#chips').innerHTML=cats.map(c=>`<button class="chip${c===cat?' on':''}" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join('')}
function render(){
  const list=SERVICES.filter(s=>(cat==='All'||s.cat===cat)&&(s.name+s.short+s.about+s.cat).toLowerCase().includes(q));
  $('#count').textContent=list.length+(list.length===1?' service':' services')+(cat!=='All'?' in '+cat:'');
  $('#grid').innerHTML=list.length?list.map(s=>`<button class="card" data-id="${s.id}"><div class="ico" aria-hidden="true">${s.icon}</div><span class="tag">${s.cat}</span><h3>${s.name}</h3><p>${s.short}</p></button>`).join(''):'<div class="empty"><h3>No services found</h3><p>Try another word or choose All.</p></div>';
}
function open_(id){
  const s=SERVICES.find(x=>x.id===id);if(!s)return;
  $('#dbody').innerHTML=`<div class="top"><div class="ico" aria-hidden="true">${s.icon}</div><h2 id="dt">${s.name}</h2><button class="x" aria-label="Close" onclick="dlg.close()">&times;</button></div>
  <p style="color:var(--muted);margin:0">${s.about}</p>
  <h3>Key features</h3><ul>${s.feats.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>
  <h3>Details</h3><div class="meta"><div><b>Category</b>${s.cat}</div><div><b>Status</b>${s.status}</div><div style="grid-column:1/-1"><b>Best for</b>${s.who}</div></div>
  <a class="btn primary" href="${s.url}" target="_blank" rel="noopener">Open ${s.name}</a>`;
  dlg.showModal();try{history.replaceState(null,'','#'+id)}catch(e){};
}
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;chips();render()}};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)open_(c.dataset.id)};
const dlg=$('#dlg');
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',()=>{try{history.replaceState(null,'',location.pathname)}catch(e){}});
chips();render();
if(location.hash)open_(location.hash.slice(1));
</script>
<script src="eco-orbit-bg.js" defer></script>
<script src="eco-logo-viewer.js" defer></script>
<script src="eco-wordmark.js" defer></script>
<script src="voice_guide.js" defer></script>
<script src="chatbot.js" data-name="Zara VLZO Chatbot" data-avatar="amira_ai_customer_service_talking.gif" data-zoom="1" defer></script>
</body>
</html>
