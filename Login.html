<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Auth Forms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .auth-container {
            position: relative;
            width: 400px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .form-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .form-container.sign-up-mode {
            transform: translateX(-100%);
        }

        .form {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 60px 40px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sign-up-form {
            left: 100%;
        }

        .form h2 {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group input:focus {
            border-color: #64b5f6;
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(100, 181, 246, 0.3);
        }

        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .switch-btn {
            color: #64b5f6;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .switch-btn:hover {
            color: #42a5f5;
            text-shadow: 0 2px 10px rgba(100, 181, 246, 0.5);
        }

        .toggle-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 40px;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateX(100%);
        }

        .auth-container.sign-up-mode .toggle-panel {
            transform: translateX(0);
        }

        .toggle-panel h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .toggle-panel p {
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .social-login {
            margin-top: 20px;
        }

        .social-btn {
            display: inline-block;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            margin: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            left: 80%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 40%;
            left: 70%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        @media (max-width: 480px) {
            .auth-container {
                width: 90%;
                margin: 20px;
            }
            
            .form {
                padding: 40px 30px;
            }
            
            .form h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container" id="authContainer">
        <div class="form-container">
            <div class="form login-form">
                <h2>Login Here!</h2>
                <form>
                    <div class="input-group">
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn"><a href="/main_files/Start_Trading.html">Sign Up</a></button>
                </form>
                <div class="social-login">
                    <a href="#" class="social-btn" aria-label="Login with Google">G</a>
                    <a href="#" class="social-btn" aria-label="Login with Facebook">f</a>
                    <a href="#" class="social-btn" aria-label="Login with Twitter">t</a>
                </div>
                <div class="switch-text">
                    Don't have an account? 
                    <span class="switch-btn" onclick="toggleForms()">Sign Up</span>
                </div>
            </div>

            <div class="form sign-up-form">
                <h2>Create Account</h2>
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                </form>
                <div class="switch-text">
                    Already have an account? 
                    <span class="switch-btn" onclick="toggleForms()">Sign In</span>
                </div>
            </div>
        </div>

        <div class="toggle-panel">
            <h3>Hello, Friend!</h3>
            <p>Enter your personal details and start your journey with us</p>
            <button class="btn" onclick="toggleForms()">Sign Up</button>
        </div>
    </div>

    <script>
        function toggleForms() {
            const container = document.getElementById('authContainer');
            container.classList.toggle('sign-up-mode');
            
            // Update toggle panel content
            const togglePanel = container.querySelector('.toggle-panel');
            const isSignUpMode = container.classList.contains('sign-up-mode');
            
            if (isSignUpMode) {
                togglePanel.innerHTML = `
                    <h3>Welcome Back!</h3>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="btn" onclick="toggleForms()">Sign In</button>
                `;
            } else {
                togglePanel.innerHTML = `
                    <h3>Hello, Friend!</h3>
                    <p>Enter your personal details and start your journey with us</p>
                    <button class="btn" onclick="toggleForms()">Sign Up</button>
                `;
            }
        }

        // Add some interactive effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Form submission handling
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault(); // Prevent default form submission
                
                const btn = this.querySelector('.btn');
                const originalText = btn.textContent;
                
                // Simulate login/signup process
                btn.textContent = 'Processing...';
                btn.style.background = 'linear-gradient(135deg, #4caf50 0%, #45a049 100%)';
                
                // For a real application, you'd send data to a server here.
                // For this example, we'll just redirect after a delay.
                setTimeout(() => {
                    // This is where you redirect to your VLZO COIN Exchange page
                    window.location.href = 'index.html'; // <<< IMPORTANT CHANGE HERE
                }, 2000); // Simulate 2-second processing time
            });
        });
    </script>
</body>
</html>
