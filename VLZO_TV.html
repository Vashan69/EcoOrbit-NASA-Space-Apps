<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLZO TV | The Third World Peace VLZO UFO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1c;--surface:#0e1830;--raised:#16244a;--line:#22335f;--text:#eaf0ff;--muted:#a3b3d6;--accent:#4fd1ff;--ink:#04101f;--red:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;line-height:1.25}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
header{position:sticky;top:0;z-index:10;background:#070d1cee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:9px;font:700 19px Sora;text-decoration:none;color:var(--text)}
.logo i{background:var(--red);color:#fff;font-style:normal;font-size:13px;padding:4px 9px;border-radius:8px}
.search{flex:1;max-width:520px;margin:0 auto}.search input{width:100%;padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.back{padding:9px 15px;border-radius:99px;background:var(--accent);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.page{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding:22px;max-width:1500px;margin:auto}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle at 30% 20%,#1b3b8a,#0a1330 70%)}
.ph .big{font:700 clamp(80px,16vw,190px)/1 Sora;color:var(--accent);text-shadow:0 0 50px #4fd1ff66}
.ph p{color:var(--muted);max-width:44ch;margin:8px auto 0}.ph h2{font-size:clamp(20px,3vw,30px)}
.ph .play{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--ink);font-size:32px;margin-bottom:16px}
.ph small{display:block;margin-top:14px;color:#ffb4c0}
.info h1{font-size:clamp(20px,2.4vw,27px);margin:16px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chan{display:flex;align-items:center;gap:11px}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c5cff);display:grid;place-items:center;font:700 16px Sora;color:var(--ink)}
.chan b{display:block}.chan span{color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface);border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-weight:500;transition:background .15s}
.pill:hover{background:var(--raised)}.pill.on{background:var(--accent);color:var(--ink);border-color:transparent}
.desc{background:var(--surface);border-radius:14px;padding:14px 16px;margin-top:16px;color:var(--muted)}
.desc b{color:var(--text)}.desc .more{display:none}.desc.open .more{display:block}
.desc button{background:none;border:0;color:var(--accent);padding:6px 0 0;font-weight:600}
.cm h2{font-size:19px;margin:26px 0 14px}
.add{display:flex;gap:12px;margin-bottom:18px}.add input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;padding:8px 2px}
.add input:focus{outline:0;border-color:var(--accent)}
.c{display:flex;gap:12px;margin-bottom:16px}.c .av{width:36px;height:36px;font-size:14px;flex:none}.c small{color:var(--muted)}.c p{margin:2px 0 0;word-break:break-word}
.next h2{font-size:16px;margin-bottom:12px}
.v{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:12px;margin-bottom:4px}
.v:hover,.v.now{background:var(--surface)}
.th{position:relative;flex:none;width:168px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#1b3b8a,#0a1330);font:700 34px Sora;color:var(--accent)}
.th.q{font-size:52px;background:radial-gradient(circle,#233f8f,#0a1330)}
.th em{position:absolute;right:6px;bottom:6px;background:#000c;color:#fff;font:600 12px Inter;font-style:normal;padding:2px 6px;border-radius:5px}
.v h3{font:600 14.5px/1.35 Inter;margin-bottom:4px}.v span{color:var(--muted);font-size:13px}
.none{color:var(--muted);padding:20px 8px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:500;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.page{grid-template-columns:1fr;padding:14px}.search{display:none}.bar{justify-content:space-between}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="VLZO_TV.html"><i>▶</i>VLZO TV</a>
  <div class="search"><input id="q" type="search" placeholder="Search videos" aria-label="Search videos"></div>
  <a class="back" href="../EcoOrbit.html">Back to app</a>
</div></header>

<div class="page">
  <main>
    <div class="player" id="player"></div>
    <div class="info">
      <h1 id="title"></h1>
      <div class="row">
        <div class="chan"><div class="av">V</div><div><b>VLZO TV</b><span>The Third World Peace VLZO UFO</span></div></div>
        <div class="acts"><button class="pill" id="like" aria-pressed="false">👍 <span id="lc">Like</span></button><button class="pill" id="share">🔗 Share</button></div>
      </div>
      <div class="desc" id="desc"><b id="meta"></b><br><span id="d1"></span><div class="more" id="d2"></div><button id="mb">Show more</button></div>
    </div>
    <section class="cm"><h2 id="ch">Comments</h2>
      <div class="add"><div class="av" style="width:36px;height:36px;border-radius:50%;background:var(--raised);display:grid;place-items:center">🙂</div><input id="ci" placeholder="Add a comment and press Enter" aria-label="Add a comment" maxlength="300"></div>
      <div id="cl"></div></section>
  </main>
  <aside class="next"><h2>Up next</h2><div id="list"></div></aside>
</div>
<div id="toast" role="status"></div>

<script>
/* Edit this list. For a file use src; for YouTube paste the video ID in yt. Leave both empty to show the "?" screen. */
const VIDEOS=[
 {id:'hackathon',title:'EcoOrbit — Full A–Z Guided Tour',dur:840,src:'videos/hackathon_presentation.mp4',yt:'',
  desc:'Our long-form EcoOrbit presentation and A–Z guided tour.',more:'Explore the orbital problem, LEO context, NASA-inspired project context, simulator, telemetry, sustainability model, collision-risk concept, technology stack, supporting pages, and future direction.'},
 {id:'mystery',title:'?',dur:30,src:'',yt:'',mystery:true,
  desc:'A 30-second surprise. Coming soon.',more:'Stay tuned. This video is not ready yet, and we are keeping it a secret for now.'}
];
const $=s=>document.querySelector(s),ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=VIDEOS[0],filter='';
const likes=JSON.parse(ls.get('vtv_likes')||'{}'),cmts=JSON.parse(ls.get('vtv_comments')||'{}');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}


async function getSavedTour(){
  try{
    if(!window.indexedDB) return null;
    const db=await new Promise((res,rej)=>{
      const q=indexedDB.open("vlzo_media",1);
      q.onupgradeneeded=()=>q.result.createObjectStore("v");
      q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
    });
    const use=await new Promise((res,rej)=>{const r=db.transaction("v").objectStore("v").get("use");r.onsuccess=()=>res(r.result||{});r.onerror=()=>rej(r.error)});
    if(!use.tv) return null;
    return await new Promise((res,rej)=>{const r=db.transaction("v").objectStore("v").get("tourLong");r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});
  }catch(e){return null}
}

async function player(){
  const v=cur,p=$('#player');
  if(v.id==='hackathon'){
    const saved=await getSavedTour();
    if(saved){
      const url=URL.createObjectURL(saved);
      p.innerHTML=`<video controls preload="metadata" src="${url}"></video><div class="ph" id="miss" style="display:none"></div>`;
      const el=p.querySelector('video'); el.playbackRate=1;
      el.onended=()=>{URL.revokeObjectURL(url);const i=VIDEOS.indexOf(v);if(VIDEOS[i+1])select(VIDEOS[i+1].id)};
      return;
    }
  }
  if(v.yt){p.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.yt}?rel=0" allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen title="${esc(v.title)}"></iframe>`;return}
  if(v.src){p.innerHTML=`<video controls preload="metadata" src="${v.src}"></video><div class="ph" id="miss" style="display:none"><div><div class="big">▶</div><h2>Video file not found</h2><p>Save your video as <b>${v.src}</b> next to this page, then refresh.</p></div></div>`;
    const el=p.querySelector('video');el.onerror=()=>{$('#miss').style.display='grid';el.style.display='none'};
    el.onended=()=>{const i=VIDEOS.indexOf(v);if(VIDEOS[i+1])select(VIDEOS[i+1].id)};return}
  p.innerHTML=`<div class="ph"><div><div class="big">?</div><h2>Coming soon</h2><p>${esc(v.desc)}</p></div></div>`;
}
function info(){
  const v=cur;document.title=v.title+' | VLZO TV';$('#title').textContent=v.mystery?'? (Coming soon)':v.title;
  $('#meta').textContent=fmt(v.dur)+' · VLZO TV';$('#d1').textContent=v.desc;$('#d2').textContent=v.more;
  $('#desc').classList.remove('open');$('#mb').textContent='Show more';
  const on=!!likes[v.id];$('#like').classList.toggle('on',on);$('#like').setAttribute('aria-pressed',on);$('#lc').textContent=on?'Liked':'Like';
  comments();
}
function comments(){const l=cmts[cur.id]||[];$('#ch').textContent=l.length+(l.length===1?' comment':' comments');
  $('#cl').innerHTML=l.length?l.map(c=>`<div class="c"><div class="av">Y</div><div><b>You</b> <small>${c.t}</small><p>${esc(c.x)}</p></div></div>`).join(''):'<p class="none">No comments yet. Be the first.</p>'}
function list(){
  const r=VIDEOS.filter(v=>v.id!==cur.id&&(v.title+v.desc).toLowerCase().includes(filter));
  $('#list').innerHTML=r.length?r.map(v=>`<button class="v" data-id="${v.id}"><div class="th${v.mystery?' q':''}">${v.mystery?'?':'▶'}<em>${fmt(v.dur)}</em></div><div><h3>${v.mystery?'? (Coming soon)':esc(v.title)}</h3><span>VLZO TV</span></div></button>`).join(''):'<p class="none">No other videos match.</p>'}
function select(id){cur=VIDEOS.find(v=>v.id===id)||VIDEOS[0];try{history.replaceState(null,'','#'+cur.id)}catch(e){};player();info();list();scrollTo({top:0,behavior:'smooth'})}

$('#list').onclick=e=>{const b=e.target.closest('.v');if(b)select(b.dataset.id)};
$('#q').oninput=e=>{filter=e.target.value.trim().toLowerCase();list()};
$('#like').onclick=()=>{likes[cur.id]=!likes[cur.id];ls.set('vtv_likes',JSON.stringify(likes));info()};
$('#share').onclick=async()=>{const u=location.href.split('#')[0]+'#'+cur.id;try{await navigator.clipboard.writeText(u);toast('Link copied')}catch(e){toast('Copy this link: '+u)}};
$('#mb').onclick=()=>{const o=$('#desc').classList.toggle('open');$('#mb').textContent=o?'Show less':'Show more'};
$('#ci').onkeydown=e=>{if(e.key!=='Enter')return;const x=e.target.value.trim();if(!x)return;
  (cmts[cur.id]=cmts[cur.id]||[]).unshift({x,t:new Date().toLocaleDateString()});ls.set('vtv_comments',JSON.stringify(cmts));e.target.value='';comments()};
select(location.hash.slice(1)||VIDEOS[0].id);
</script>
<script src="voice_guide.js" defer></script>
<script src="chatbot.js" data-name="Amira Mozumder Zara" data-avatar="../images/Amira_Mozumder_Zara.png" data-zoom="1" defer></script>
</body>
</html>
